version: '3.8'

services:
  autotest:
    build: .
    ports:
      - "3000:3000"  # Studio UI
      - "4723:4723"  # Appium Server
    volumes:
      - ./core:/app/core        # Persist Mappings and Data Matrix
      - ./results:/app/results  # Persist Screenshots and Reports
    restart: always
    environment:
      - AUTOTEST_PLATFORM=web   # Default context
    shm_size: '2gb'             # Essential for Playwright browser stability in containers