<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Login — Fixture App</title></head>
<body>
<h1>Login</h1>
<form id="login-form">
  <label for="username">Username</label>
  <input id="username" name="username" type="text" autocomplete="off">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="off">
  <button type="submit">Login</button>
</form>
<div id="banner" role="alert" hidden></div>
<div id="success" hidden>Login successful. Welcome, <span id="who"></span>!</div>
<script>
document.getElementById('login-form').addEventListener('submit', e => {
  e.preventDefault();
  const u = document.getElementById('username').value;
  const p = document.getElementById('password').value;
  const banner = document.getElementById('banner');
  const success = document.getElementById('success');
  if (u === 'tester' && p === 'Test123!') {
    banner.hidden = true;
    success.hidden = false;
    document.getElementById('who').textContent = u;
  } else {
    success.hidden = true;
    banner.hidden = false;
    banner.textContent = 'Invalid username or password.';
  }
});
</script>
</body>
</html>
