<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Table — Fixture App</title></head>
<body>
<h1>Records</h1>
<table id="records">
  <thead><tr><th>ID</th><th>Name</th><th>Actions</th></tr></thead>
  <tbody></tbody>
</table>
<button id="prev">Previous</button>
<span id="page-indicator"></span>
<button id="next">Next</button>

<dialog id="confirm-modal">
  <p>Delete <span id="confirm-name"></span>?</p>
  <button id="confirm-yes">Yes, Delete</button>
  <button id="confirm-no">Cancel</button>
</dialog>
<div id="status" hidden></div>

<script>
let RECORDS = Array.from({ length: 12 }, (_, i) => ({ id: i + 1, name: `Record ${i + 1}` }));
const PAGE_SIZE = 5;
let page = 0;
let pendingDeleteId = null;

const tbody = document.querySelector('#records tbody');
const indicator = document.getElementById('page-indicator');
const modal = document.getElementById('confirm-modal');
const status = document.getElementById('status');

function render() {
  const start = page * PAGE_SIZE;
  const rows = RECORDS.slice(start, start + PAGE_SIZE);
  tbody.innerHTML = '';
  for (const r of rows) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${r.id}</td><td>${r.name}</td><td>
      <button class="edit-btn" data-id="${r.id}">Edit</button>
      <button class="delete-btn" data-id="${r.id}">Delete</button>
    </td>`;
    tbody.appendChild(tr);
  }
  const totalPages = Math.max(1, Math.ceil(RECORDS.length / PAGE_SIZE));
  indicator.textContent = `Page ${page + 1} of ${totalPages}`;
  document.getElementById('prev').disabled = page === 0;
  document.getElementById('next').disabled = page >= totalPages - 1;
}

document.getElementById('prev').addEventListener('click', () => { if (page > 0) { page--; render(); } });
document.getElementById('next').addEventListener('click', () => {
  if ((page + 1) * PAGE_SIZE < RECORDS.length) { page++; render(); }
});

tbody.addEventListener('click', e => {
  const id = Number(e.target.dataset.id);
  if (!id) return;
  if (e.target.classList.contains('edit-btn')) {
    status.hidden = false;
    status.textContent = `Editing record ${id}`;
  } else if (e.target.classList.contains('delete-btn')) {
    pendingDeleteId = id;
    document.getElementById('confirm-name').textContent = RECORDS.find(r => r.id === id).name;
    modal.showModal();
  }
});

document.getElementById('confirm-yes').addEventListener('click', () => {
  RECORDS = RECORDS.filter(r => r.id !== pendingDeleteId);
  modal.close();
  status.hidden = false;
  status.textContent = `Deleted record ${pendingDeleteId}`;
  page = 0;
  render();
});
document.getElementById('confirm-no').addEventListener('click', () => modal.close());

render();
</script>
</body>
</html>
